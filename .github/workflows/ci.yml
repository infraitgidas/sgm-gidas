name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Mensajes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar formato convencional
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE_SHA}..${HEAD_SHA}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          fi

          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+(, ?[a-z0-9._-]+)*\))?!?: .+'
          invalid=0
          while IFS= read -r subject; do
            if [[ ! "${subject}" =~ ${pattern} ]]; then
              echo "Mensaje invalido: ${subject}"
              invalid=1
            fi
          done < <(git log --no-merges --format='%s' "${range}")
          exit "${invalid}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    name: Infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar plantillas sin secretos reales
        shell: bash
        run: |
          cp .env.production.example .env.production
          cp backend/.env.production.example backend/.env.production
      - name: Validar Compose productivo
        run: docker compose --env-file .env.production config --quiet
      - name: Validar topologia productiva
        run: python backend/tools/validate_production_topology.py --env-file .env.production
      - name: Escanear secretos versionables
        run: python backend/tools/scan_tracked_secrets.py
