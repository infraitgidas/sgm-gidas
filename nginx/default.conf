limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# El proxy externo es el unico cliente esperado cuando Compose se enlaza a
# 127.0.0.1. Se acepta exclusivamente http/https y se usa el esquema local si
# el header no existe o contiene otro valor.
map $http_x_forwarded_proto $gidas_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain
        image/svg+xml
        font/woff
        font/woff2;

    set $frontend_upstream http://frontend:8080;
    set $frontend_sgm_upstream http://frontend_sgm:8080;
    set $backend_upstream http://backend:5000;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    client_max_body_size 20M;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @rate_limited;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Lo sentimos, recibimos demasiadas solicitudes. Intente nuevamente en 30 segundos.","retry_after":30}';
    }

    # Portal: API de la SGM bajo /sgm-gidas/api/ -> backend (quita el prefijo)
    location /sgm-gidas/api/ {
        rewrite ^/sgm-gidas(/.*)$ $1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Portal: SPA de la SGM bajo /sgm-gidas/ -> frontend buildado con base /sgm-gidas/
    # proxy_pass con variable: el resolver resuelve en tiempo de request y
    # permite validar la config con nginx -t fuera de la red compose.
    location /sgm-gidas/ {
        proxy_pass $frontend_sgm_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn api_conn 20;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn api_conn 20;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_conn api_conn 10;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/logout {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn api_conn 20;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/cambiar-password {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn api_conn 10;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn api_conn 50;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gidas_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }
}
