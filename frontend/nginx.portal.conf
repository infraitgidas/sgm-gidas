server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain
        image/svg+xml
        font/woff
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;

    # Los assets físicos (dist/assets/) se exponen bajo /sgm-gidas/assets/
    location /sgm-gidas/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta bajo /sgm-gidas/ sirve el index
    location /sgm-gidas/ {
        try_files $uri $uri/ /index.html;
    }

    # Raíz del contenedor: redirige a /sgm-gidas/ (para no romper si alguien entra directo)
    location = / {
        return 301 /sgm-gidas/;
    }
}
